name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Name the file
        run: cp app/build/outputs/apk/debug/app-debug.apk TeluguCalendar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TeluguCalendar-apk
          path: TeluguCalendar.apk
      - name: Save the APK on the apk branch
        run: |
          mkdir -p /tmp/out && cp TeluguCalendar.apk /tmp/out/
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf . -q
          cp /tmp/out/TeluguCalendar.apk .
          git add TeluguCalendar.apk
          git commit -q -m "Built TeluguCalendar.apk"
          git push -f origin apk
