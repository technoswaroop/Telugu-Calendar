<!doctype html>
<html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telugu Calendar</title>
<style>
/* Layout: printed-page look. Weekday rows by week columns with ruled cells; festivals box in the empty cells; colour and dark are independent switches. */
:root{
  --paper:#ffffff; --ink:#111111; --rule:#111111; --muted:#4d4d57; --red:#b3261e; --hl:#ffe9a8;
  --band:#111111; --band-ink:#ffffff;
  --wkbg:#ffffff; --fbg:#ffffff; --pbg:#ffffff; --abg:#ffffff; --sunc:#111111;
  --num:"Oswald","Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif;
  --tel:"Noto Sans Telugu",system-ui,sans-serif;
}
:root[data-color="1"]{
  --paper:#fbfbff; --ink:#17163a; --rule:#4a4c9a; --muted:#555a84; --red:#c0262d; --hl:#ffe08a;
  --band:#2d2a8a; --band-ink:#ffffff;
  --wkbg:#e9ebff; --fbg:#fde7e5; --pbg:#fff1c7; --abg:#dfe3ff; --sunc:#c0262d;
}
:root[data-dark="1"]{
  --paper:#14141c; --ink:#f1f1f4; --rule:#6a6a80; --muted:#b0b0c4; --red:#ff9d94; --hl:#4a3d12;
  --band:#f1f1f4; --band-ink:#14141c;
  --wkbg:#14141c; --fbg:#14141c; --pbg:#14141c; --abg:#14141c; --sunc:#f1f1f4; color-scheme:dark;
}
:root[data-dark="1"][data-color="1"]{
  --paper:#11122b; --ink:#ecebfa; --rule:#6f73d1; --muted:#aab0dd; --red:#ff9d94; --hl:#4a3d12;
  --band:#4b49c9; --band-ink:#ffffff;
  --wkbg:#1b1d45; --fbg:#3b1f2e; --pbg:#3a3118; --abg:#1f2350; --sunc:#ff9d94; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--tel);font-size:15px;line-height:1.5;
  padding-block:0 76px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
.wrap{max-width:760px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;padding:6px 0 6px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 8px;margin-bottom:4px}
.bar h1{margin:0;font:700 14px/1.1 var(--num);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.sws{display:flex;gap:2px}
.sw{display:flex;align-items:center;gap:4px;background:transparent;border:0;color:var(--ink);font:700 11px var(--tel);cursor:pointer;min-height:40px;padding:0 2px}
.sw i{position:relative;width:34px;height:22px;border:1.5px solid var(--rule);border-radius:11px;background:var(--paper);flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink)}
.sw[aria-checked="true"] i{background:var(--band)}
.sw[aria-checked="true"] i::after{transform:translateX(12px);background:var(--band-ink)}
@media (prefers-reduced-motion:no-preference){.sw i::after{transition:transform .15s}}
.chips{position:relative;display:flex;border:1.5px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:1 0 auto;min-width:84px;border:0;border-right:1.5px solid var(--rule);background:transparent;color:var(--ink);padding:3px 8px;font:700 14px/1.2 var(--tel);cursor:pointer;min-height:44px}
.chips button:last-child{border-right:0}
.chips small{display:block;font:500 11px/1 var(--num);opacity:.8;letter-spacing:.06em}
.chips button[aria-pressed="true"]{background:var(--band);color:var(--band-ink)}
button:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.page{margin-top:6px;display:flex;flex-direction:column}
.top{display:contents}
.top>div{padding:6px 10px;font-size:12px;line-height:1.45;min-width:0;border:1.5px solid var(--rule);margin-top:8px;order:3}
.top .mid{order:0;margin-top:0;padding:4px 10px;text-align:center;display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap}
.mid .en{font:700 18px/1.1 var(--num);letter-spacing:.12em}
.mid .y{font:700 28px/1 var(--num)}
.mid .te{font:800 18px/1.2 var(--tel)}
.top b{font-weight:800}
.top table{border-collapse:collapse;margin-top:4px;font-variant-numeric:tabular-nums;width:100%;max-width:320px}
.top th,.top td{border:1px solid var(--rule);padding:0 6px;text-align:center;font-weight:500}
.cred{font-size:11px;color:var(--muted);margin-top:6px}
.nodata{font-size:13px}
.scroll{order:1;overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch}
.g{display:grid;border-top:1.5px solid var(--rule);border-left:1.5px solid var(--rule)}
.g>*{border:0;border-right:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);min-width:0;overflow:hidden}
.wk{position:sticky;left:0;z-index:2;background:var(--wkbg);padding:3px 4px}
.wk.sun .en,.wk.sun .te{color:var(--sunc)}
.wk .en{font:700 22px/1 var(--num)}
.wk .te{font:800 17px/1.15 var(--tel)}
.wk .t{font-size:9.5px;line-height:1.35;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.dc{text-align:left;background:transparent;color:var(--ink);padding:3px 4px;font:inherit;cursor:pointer;min-height:84px}
.dc.f{background:var(--fbg)}
.dc.pf{background:var(--pbg)}
.dc.pn{background:var(--abg)}
.dc .hd{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.dc .n{font:700 26px/1 var(--num);display:inline-block}
.dc .n.full{border:2px solid var(--ink);border-radius:50%;padding:2px 4px 0}
.dc .n.new::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--ink);margin-right:2px;vertical-align:1px}
.dc .mk{font:800 10px var(--tel)}
.dc .ms{font:800 10px var(--tel);background:var(--band);color:var(--band-ink);padding:0 3px}
.dc .l{font-size:10px;line-height:1.3;overflow-wrap:anywhere;margin-top:1px}
.dc .x{font-size:9.5px;font-weight:800;color:var(--red);overflow-wrap:anywhere}
.dc.f .n{color:var(--red)}
.dc.td{background:var(--hl)}
.dc.sel{box-shadow:inset 0 0 0 2px var(--red)}
.fb{position:relative;min-height:0}
.fb h4{margin:0;background:var(--band);color:var(--band-ink);font:800 11px var(--tel);text-align:center;padding:1px 0}
.fb .fl{position:absolute;left:0;right:0;top:18px;bottom:0;font-size:9.5px;line-height:1.3;padding:2px 3px;overflow:auto}
.band{order:2;background:var(--band);color:var(--band-ink);text-align:center;font:800 14px var(--tel);padding:8px 10px;margin-top:8px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.nav{display:flex;gap:8px;margin:10px 0}
.nav button{border:1.5px solid var(--rule);background:transparent;color:var(--ink);min-width:52px;height:46px;font:700 22px var(--tel);cursor:pointer}
.nav .today{flex:1;font:700 15px var(--tel)}
.hero{border:1.5px solid var(--rule);padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:0 16px;align-items:center}
.hero .num{font:700 84px/1 var(--num);grid-row:span 3}
.hero .num.full{border:3px solid var(--ink);border-radius:50%;padding:6px 14px 0}
.hero .wd{font:800 26px/1.2 var(--tel)}
.hero .en{font:500 14px var(--num);letter-spacing:.06em;color:var(--muted)}
.hero .masa{font-size:14px;font-weight:700}
.rows{display:grid;margin-top:-1.5px}
.row{border:1.5px solid var(--rule);padding:6px 14px;margin-top:-1.5px;min-width:0}
.row h3{margin:0;font:700 12px var(--tel);color:var(--muted)}
.row p{margin:0;font-size:18px;font-weight:500;overflow-wrap:anywhere}
.row .note{font-size:12px;color:var(--muted)}
.row.fest{background:var(--band);color:var(--band-ink)}
.row.fest h3{color:var(--band-ink);opacity:.8}
.row.fest p{font-weight:800}
.split{display:grid;grid-template-columns:1fr 1fr;margin-top:-1.5px}
.split .row{margin-top:0}
.split .row+.row{margin-left:-1.5px}
@media (max-width:360px){.split{grid-template-columns:1fr}.split .row+.row{margin-left:0;margin-top:-1.5px}}
.tag{display:inline-block;border:1.5px solid var(--rule);padding:0 8px;font-size:13px;font-weight:700;margin-top:2px}
.info{margin-top:12px;border:1.5px solid var(--rule);padding:8px 12px;font-size:13px}
.info table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.info th,.info td{text-align:left;padding:2px 6px;border-bottom:1px solid var(--rule)}
.info h3{margin:0 0 4px;font:800 14px var(--tel)}
.flist{display:grid;margin-top:10px;border-top:1.5px solid var(--rule)}
.flist button{display:grid;grid-template-columns:54px 1fr;gap:10px;text-align:left;background:transparent;border:0;border-bottom:1.5px solid var(--rule);color:var(--ink);padding:8px 4px;font:inherit;font-weight:700;cursor:pointer;min-height:48px}
.flist b{font:700 30px/1 var(--num);color:var(--red)}
.flist em{display:block;font-style:normal;font-size:12px;font-weight:500;color:var(--muted)}
.verify{margin-top:10px;font-size:12px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1.5px solid var(--rule);display:flex;
  padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-right,0px));z-index:6}
.tabs button{flex:1;height:56px;border:0;border-right:1.5px solid var(--rule);background:transparent;color:var(--ink);font:700 15px var(--tel);cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button[aria-selected="true"]{background:var(--band);color:var(--band-ink)}
.zctl{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;align-items:center;background:var(--paper);border:1.5px solid var(--rule)}
.zctl button{width:46px;height:46px;border:0;background:var(--band);color:var(--band-ink);font:700 26px/1 var(--tel);cursor:pointer}
.zctl button:disabled{opacity:.35}
.zctl span{min-width:56px;text-align:center;font:700 15px var(--num);font-variant-numeric:tabular-nums;color:var(--ink)}
</style></head><body>

<div class="wrap" id="app">
  <header>
    <div class="bar">
      <h1>Telugu Calendar</h1>
      <div class="sws">
        <button class="sw" id="swColor" role="switch" aria-checked="false"><span>రంగులు</span><i></i></button>
        <button class="sw" id="swDark" role="switch" aria-checked="false"><span>డార్క్</span><i></i></button>
      </div>
    </div>
    <div class="chips" id="months"></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-v="month" aria-selected="true">నెల</button>
  <button role="tab" data-v="day" aria-selected="false">రోజు</button>
  <button role="tab" data-v="fest" aria-selected="false">పండుగలు</button>
</nav>

    var kk=md.k.map(function(v,i){return WD[i]+" "+v}).join(", ");
    h+='<div><b>శ్రీ పరాభవ నామ సంవత్సరం</b><br>'+md.hdr+'<table><tr><th>తేది</th><th>సూ.ఉ.</th><th>అస్త</th></tr>'+md.sun.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>'}).join("")+'</table></div>';
    h+='<div class="k"><b>'+md.kName+':</b> సూర్యోదయం 6 గంటలు అయితే '+kk+'<div class="cred">పంచాంగకర్తలు: కీ.శే. బ్రహ్మశ్రీ తంగిరాల పూర్ణయ్య సిద్ధాంతి గారి పౌత్రులు పట్టాభిరామయ్య మరియు రామనాథ సిద్ధాంతి, రేలంగి</div></div>';
  }else h+='<div class="nodata">'+NODATA+'</div>';
  h+='</div>';
  st.N=N;
  h+='<div class="scroll"><div class="g" style="grid-template-columns:58px repeat('+N+',minmax(78px,1fr));zoom:'+curZ(N)+'">';
  for(r=0;r<7;r++){
    h+='<div class="wk'+(r===0?' sun':'')+'" style="grid-row:'+(r+1)+';grid-column:1"><div class="en">'+WDEN[r]+'</div><div class="te">'+WD[r]+'</div>'+(md?'<div class="t">'+md.wd[r].join("<br>")+'</div>':'')+'</div>';
  }
  for(c=0;c<N;c++)for(r=0;r<7;r++){
    var dd=occ[c+"-"+r],pos='grid-row:'+(r+1)+';grid-column:'+(c+2);
    if(dd){
      var D=md?md.d[dd-1]:null,mt=D?moonType(D[0]):"",f=fests(md,dd).length;
      var mk=mt==="new"?'అమా':mt==="full"?'పౌర్ణ':'';
      var ms=md?MASA.filter(function(x){return x[0]===m&&x[1]===dd&&dd>1}).map(function(x){return x[2]})[0]:null;
      h+='<button class="dc'+(f?' f':'')+(mt==="full"?' pf':'')+(mt==="new"?' pn':'')+(isToday(y,m,dd)?' td':'')+(dd===st.d?' sel':'')+'" style="'+pos+'" data-d="'+dd+'" aria-label="'+dd+' '+MTE[m-1]+' '+y+'">'+
         '<div class="hd"><span class="n '+mt+'">'+dd+'</span><span class="mk">'+mk+'</span>'+(ms?'<span class="ms">'+ms+'</span>':'')+'</div>'+
         (D?'<div class="l">'+D[0]+'</div><div class="l">'+D[1]+'</div><div class="l">'+vj(D[2])+'</div>'+(D[3]?'<div class="x">'+D[3]+'</div>':''):'')+'</button>';
    }else if(md&&best&&c===best.c&&r===best.s){
      h+='<aside class="fb" style="grid-row:'+(best.s+1)+'/'+(best.e+1)+';grid-column:'+(c+2)+'"><h4>పండుగలు</h4><div class="fl">'+
         md.fest.map(function(x){return x[0]+') '+x[1]}).join("<br>")+'</div></aside>';
    }else if(!(md&&best&&c===best.c&&r>best.s&&r<best.e)){
      h+='<div style="'+pos+'"></div>';
    }
  }
  h+='</div></div>';
  if(md)h+='<div class="band">'+md.greet+'</div>';
  h+='</div>';
  if(md)h+='<div class="info"><h3>పండుగలు</h3>'+md.fest.map(function(x){return x[0]+') '+x[1]}).join('<br>')+'</div>';
  h+='<div class="hint">తేదీని నొక్కితే ఆ రోజు వివరాలు తెరుచుకుంటాయి. + తో పెద్దది చేసినప్పుడు ఎడమవైపుకు జరిపి మిగిలిన వారాలు చూడవచ్చు.</div>';
  h+=zctl();
  return h;
}
function row(h,p,cls,note){
  return '<div class="row '+(cls||"")+'"><h3>'+h+'</h3><p>'+p+'</p>'+(note?'<div class="note">'+note+'</div>':'')+'</div>';
}
function dayView(){
  var y=Y(),m=Mo(),d=st.d,md=mdata(y,m),D=md?md.d[d-1]:null,w=wdOf(y,m,d),mt=D?moonType(D[0]):"",f=fests(md,d),h="";
  h+='<div class="nav"><button id="prev" aria-label="క్రితం రోజు">‹</button><button class="today" id="today">ఈ రోజు</button><button id="next" aria-label="మరుసటి రోజు">›</button></div>';
  h+='<section class="hero"><div class="num '+mt+'">'+d+'</div><div class="wd">'+WD[w]+'వారం</div><div class="en">'+WDEN[w]+' · '+MEN[m-1]+' '+y+' · '+MTE[m-1]+'</div>'+
     (md?'<div class="masa">'+masa(m,d)+' మాసం'+(mt==="new"?' · అమావాస్య':mt==="full"?' · పౌర్ణమి':'')+'</div>':'')+'</section>';
  if(!md)return h+'<div class="info nodata">'+NODATA+'</div>';
  h+='<div class="rows">';
  if(f.length)h+=row("పండుగలు",f.map(function(x){return x[1]}).join("<br>"),"fest");
  h+=row("తిథి",D[0],"",D[3]?'<span class="tag">'+D[3]+'</span>':"");
  h+=row("నక్షత్రం",D[1]);
  h+=row("వర్జ్యం",vj(D[2]));
  h+='<div class="split">'+row(md.kName,md.k[w])+row("దుర్ముహూర్తం",md.wd[w].join("<br>"))+'</div></div>';
  h+='<div class="info"><h3>సూర్యోదయ / సూర్యాస్తమయాలు</h3><table><tr><th>తేది</th><th>సూ.ఉ.</th><th>అస్త.</th></tr>'+
     md.sun.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>'}).join("")+
     '</table><div style="margin-top:6px;color:var(--muted)">'+md.kName+' సూర్యోదయం 6 గంటలు అయితే చూపినది. '+md.hdr+'.</div></div>';
  h+='<div class="band" style="margin-top:12px;order:0">'+md.greet+'</div>';
  if(CHECK[m+"-"+d])h+='<div class="verify">ఈ రోజు వివరాలు ముద్రిత క్యాలెండర్‌తో ఒకసారి సరిచూడండి.</div>';
  return h;
}
function festView(){
  var y=Y(),m=Mo(),md=mdata(y,m);
  if(!md)return '<div class="info nodata">'+NODATA+'</div>';
  return '<div class="flist">'+md.fest.map(function(f){
    return '<button data-d="'+f[0]+'"><b>'+f[0]+'</b><span>'+f[1]+'<em>'+WD[wdOf(y,m,f[0])]+'వారం · '+masa(m,f[0])+'</em></span></button>'}).join("")+'</div><div class="band" style="margin-top:12px;order:0">'+md.greet+'</div>';
}
function zctl(){
  return '<div class="zctl" role="group" aria-label="జూమ్"><button data-z="-1" aria-label="చిన్నది చేయి"'+(st.zi===0?' disabled':'')+'>−</button><span id="zl">'+Math.round(ML[st.zi]*100)+'%</span><button data-z="1" aria-label="పెద్దది చేయి"'+(st.zi===ML.length-1?' disabled':'')+'>+</button></div>';
}
function zoomBy(k){
  st.zi=Math.max(0,Math.min(ML.length-1,st.zi+k));
  var g=document.querySelector(".g");if(g)g.style.zoom=curZ(st.N);
  $("zl").textContent=Math.round(ML[st.zi]*100)+"%";
  var bs=document.querySelectorAll(".zctl button");
  bs[0].disabled=st.zi===0;bs[1].disabled=st.zi===ML.length-1;
  try{localStorage.setItem("pz2",String(st.zi))}catch(e){}
}
function render(){
  renderMonths();
  $("main").innerHTML=st.v==="day"?dayView():st.v==="month"?monthView():festView();
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.setAttribute("aria-selected",String(b.dataset.v===st.v))});
}
function setMonth(i,d){
  st.i=i;var n=dim(MONTHS[i][0],MONTHS[i][1]);st.d=Math.max(1,Math.min(d||st.d,n));
}
function go(i,d){setMonth(i,d);st.v="day";render();window.scrollTo(0,0)}
function step(k){
  var i=st.i,d=st.d+k,y=MONTHS[i][0],m=MONTHS[i][1];
  if(d<1){if(i===0)return;i--;d=dim(MONTHS[i][0],MONTHS[i][1])}
  else if(d>dim(y,m)){if(i===MONTHS.length-1)return;i++;d=1}
  setMonth(i,d);render();window.scrollTo(0,0);
}
function todayIdx(){
  var t=new Date(),y=t.getFullYear(),m=t.getMonth()+1,k;
  for(k=0;k<MONTHS.length;k++)if(MONTHS[k][0]===y&&MONTHS[k][1]===m)return [k,t.getDate()];
  return null;
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.id==="swDark"){pref.dark=!isDark();applyTheme();saveTheme();return}
  if(b.id==="swColor"){pref.color=pref.color?0:1;applyTheme();saveTheme();return}
  if(b.dataset.z!==undefined){zoomBy(+b.dataset.z);return}
  if(b.dataset.i!==undefined){setMonth(+b.dataset.i);render();return}
  if(b.dataset.v){st.v=b.dataset.v;render();window.scrollTo(0,0);return}
  if(b.dataset.d){go(st.i,+b.dataset.d);return}
  if(b.id==="prev")step(-1);
  if(b.id==="next")step(1);
  if(b.id==="today"){var t=todayIdx();if(t)go(t[0],t[1]);else go(0,1)}
});
var sx=null,sy=null;
document.addEventListener("touchstart",function(e){if(e.touches.length===1&&!e.target.closest(".scroll,.chips")){sx=e.touches[0].clientX;sy=e.touches[0].clientY}else sx=null},{passive:true});
document.addEventListener("touchend",function(e){
  if(sx===null)return;
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
  if(st.v==="day")step(dx<0?1:-1);
  else{var ni=st.i+(dx<0?1:-1);if(ni>=0&&ni<MONTHS.length){setMonth(ni);render();window.scrollTo(0,0)}}
},{passive:true});
window.addEventListener("resize",function(){var g=document.querySelector(".g");if(g&&st.v==="month")g.style.zoom=curZ(st.N)});
applyTheme();
(function(){var t=todayIdx();if(t)setMonth(t[0],t[1]);else setMonth(0,1);render()})();
</script>
</body></html>
