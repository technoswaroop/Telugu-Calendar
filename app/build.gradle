plugins {
    id 'com.android.application'
}

android {
    namespace 'com.swaroop.panchangam'
    compileSdk 34

    defaultConfig {
        applicationId "com.swaroop.panchangam"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs on your own phone without a keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
